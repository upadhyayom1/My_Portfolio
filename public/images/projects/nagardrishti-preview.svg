<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="1200" height="750" rx="12" fill="#FBFBF9" stroke="#E5E7EB" stroke-width="2"/>
  
  <defs>
    <!-- Map Grid Pattern -->
    <pattern id="mapgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 2"/>
    </pattern>
    <!-- Road Gradient -->
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0F11"/>
      <stop offset="60%" stop-color="#0E0F11"/>
      <stop offset="100%" stop-color="#17804A"/>
    </linearGradient>
  </defs>

  <!-- Top Application Bar -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="0" y="44" width="1200" height="20" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Window dots -->
  <circle cx="36" cy="32" r="6" fill="#D7D9DE"/>
  <circle cx="56" cy="32" r="6" fill="#E5E7EB"/>
  <circle cx="76" cy="32" r="6" fill="#E5E7EB"/>

  <!-- Brand Title -->
  <text x="110" y="38" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="16" fill="#0E0F11" letter-spacing="-0.02em">Nagar-Drishti</text>
  <rect x="235" y="22" width="130" height="20" rx="4" fill="#F0F0ED"/>
  <text x="245" y="36" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72" letter-spacing="0.04em">URBAN INTELLIGENCE</text>

  <!-- Mode Badge -->
  <rect x="380" y="18" width="220" height="28" rx="6" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="396" y="36" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="13" fill="#0E0F11">Civil Lines Junction Network</text>
  <text x="565" y="35" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72">▾</text>

  <!-- Live Feed Status -->
  <circle cx="1030" cy="32" r="4" fill="#17804A"/>
  <text x="1042" y="36" font-family="'DM Mono', monospace" font-size="11" fill="#17804A" letter-spacing="0.04em">14 CAMERAS ONLINE</text>
  <rect x="860" y="20" width="150" height="24" rx="4" fill="#F0F0ED"/>
  <text x="872" y="36" font-family="'DM Mono', monospace" font-size="11" fill="#0E0F11">ANPR: INFERENCE 42MS</text>

  <!-- Main Left: Map Analytics Viewport (Width: 740px) -->
  <g transform="translate(36, 90)">
    <rect width="720" height="624" rx="8" fill="#F5F5F2" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect width="720" height="624" rx="8" fill="url(#mapgrid)"/>

    <!-- Map Road Network -->
    <!-- Major Arterial Avenue -->
    <path d="M 40 180 Q 240 160 420 280 T 680 420" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <path d="M 40 180 Q 240 160 420 280 T 680 420" fill="none" stroke="#D7D9DE" stroke-width="2"/>

    <!-- Cross Street 1 -->
    <path d="M 220 50 L 250 560" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M 220 50 L 250 560" fill="none" stroke="#D7D9DE" stroke-width="1.5"/>

    <!-- Cross Street 2 -->
    <path d="M 520 40 L 460 580" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <path d="M 520 40 L 460 580" fill="none" stroke="#D7D9DE" stroke-width="1.5"/>

    <!-- Ring Road Connector -->
    <path d="M 120 480 Q 340 380 620 200" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M 120 480 Q 340 380 620 200" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Vehicle Trajectory Path (Tracked Target) -->
    <path d="M 80 176 L 235 174 L 320 215 L 420 280 L 490 310 L 580 370" fill="none" stroke="url(#routeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Direction arrows on trajectory -->
    <circle cx="235" cy="174" r="3.5" fill="#0E0F11"/>
    <circle cx="320" cy="215" r="3.5" fill="#0E0F11"/>
    <circle cx="420" cy="280" r="3.5" fill="#0E0F11"/>
    <circle cx="490" cy="310" r="3.5" fill="#0E0F11"/>

    <!-- Current Target Vehicle Location -->
    <circle cx="580" cy="370" r="16" fill="#17804A" fill-opacity="0.2"/>
    <circle cx="580" cy="370" r="7" fill="#17804A"/>
    <circle cx="580" cy="370" r="2.5" fill="#FFFFFF"/>

    <!-- Target Label Tooltip -->
    <g transform="translate(500, 395)">
      <rect width="180" height="50" rx="6" fill="#0E0F11"/>
      <text x="12" y="20" font-family="'DM Mono', monospace" font-size="11" font-weight="500" fill="#FAFAF8">TARGET: UP-70-DA-4891</text>
      <text x="12" y="38" font-family="'DM Mono', monospace" font-size="10" fill="#A1A1AA">Speed: 44 km/h · Normal</text>
    </g>

    <!-- Camera Nodes (with radar coverage) -->
    <!-- Camera 1 -->
    <circle cx="235" cy="174" r="28" fill="#0E0F11" fill-opacity="0.04"/>
    <circle cx="235" cy="174" r="6" fill="#0E0F11"/>
    <rect x="195" y="125" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="235" y="140" font-family="'DM Mono', monospace" font-size="10" fill="#0E0F11" text-anchor="middle">CAM-01 / NW</text>

    <!-- Camera 2 -->
    <circle cx="420" cy="280" r="28" fill="#0E0F11" fill-opacity="0.04"/>
    <circle cx="420" cy="280" r="6" fill="#0E0F11"/>
    <rect x="380" y="235" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="420" y="250" font-family="'DM Mono', monospace" font-size="10" fill="#0E0F11" text-anchor="middle">CAM-02 / CTR</text>

    <!-- Camera 3 -->
    <circle cx="500" cy="90" r="28" fill="#0E0F11" fill-opacity="0.04"/>
    <circle cx="500" cy="90" r="6" fill="#0E0F11"/>
    <rect x="460" y="45" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="500" y="60" font-family="'DM Mono', monospace" font-size="10" fill="#0E0F11" text-anchor="middle">CAM-03 / N</text>

    <!-- Camera 4 (Predicted Next) -->
    <circle cx="650" cy="410" r="34" fill="#17804A" fill-opacity="0.08" stroke="#17804A" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="650" cy="410" r="6" fill="#17804A"/>
    <rect x="610" y="460" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#17804A" stroke-width="1"/>
    <text x="660" y="475" font-family="'DM Mono', monospace" font-size="10" fill="#17804A" text-anchor="middle">PREDICTED: CAM-04</text>

    <!-- Map UI Controls -->
    <rect x="20" y="20" width="160" height="34" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="36" y="42" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="12" fill="#0E0F11">Layers: Geo-Graph</text>
  </g>

  <!-- Right Column: ANPR ML & Trajectory Forensics (Width: 380px) -->
  <g transform="translate(784, 90)">
    <!-- Top ANPR Detection Card -->
    <rect width="380" height="295" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect width="380" height="44" rx="8" fill="#FAFAF8"/>
    <line x1="0" y1="44" x2="380" y2="44" stroke="#E5E7EB" stroke-width="1"/>
    <text x="18" y="28" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13" fill="#0E0F11">ANPR Recognition Stream</text>
    <rect x="290" y="12" width="75" height="20" rx="4" fill="#17804A" fill-opacity="0.1"/>
    <text x="302" y="26" font-family="'DM Mono', monospace" font-size="10" fill="#17804A">CONF 98.4%</text>

    <!-- Simulated ANPR Camera Crop -->
    <rect x="18" y="60" width="344" height="135" rx="6" fill="#18191E"/>
    <!-- Vehicle Outline -->
    <path d="M 60 160 L 95 110 L 250 110 L 290 160 Z" fill="#2E3039"/>
    <!-- Plate Frame -->
    <rect x="135" y="140" width="110" height="32" rx="3" fill="#FAFAF8" stroke="#0E0F11" stroke-width="2"/>
    <rect x="140" y="144" width="8" height="24" fill="#1E3A8A"/>
    <text x="195" y="162" font-family="'DM Mono', monospace" font-weight="700" font-size="13" fill="#0E0F11" text-anchor="middle">UP70 DA 4891</text>
    <!-- Detection Bounding Box -->
    <rect x="125" y="132" width="130" height="48" rx="4" fill="none" stroke="#17804A" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="125" y="116" width="70" height="16" rx="2" fill="#17804A"/>
    <text x="130" y="128" font-family="'DM Mono', monospace" font-size="9" fill="#FFFFFF">PLATE DETECT</text>

    <!-- Detection Details -->
    <text x="18" y="222" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">TIMESTAMP: 14:12:08.41 IST</text>
    <text x="18" y="244" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">JUNCTION: Civil Lines Rd · Node 02</text>
    <text x="18" y="266" font-family="'DM Mono', monospace" font-size="11" fill="#17804A">STATUS: CLEAR (NO BLACKLIST MATCH)</text>

    <!-- Bottom ML Anomaly & Trajectory Diagnostic Card -->
    <g transform="translate(0, 315)">
      <rect width="380" height="309" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
      <rect width="380" height="44" rx="8" fill="#FAFAF8"/>
      <line x1="0" y1="44" x2="380" y2="44" stroke="#E5E7EB" stroke-width="1"/>
      <text x="18" y="28" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13" fill="#0E0F11">Trajectory Anomaly Analysis</text>
      <text x="310" y="28" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">DBSCAN</text>

      <!-- Anomaly Score Meter -->
      <text x="18" y="74" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">ISOLATION FOREST SCORE</text>
      <rect x="18" y="86" width="344" height="8" rx="4" fill="#F0F0ED"/>
      <rect x="18" y="86" width="60" height="8" rx="4" fill="#17804A"/>
      <text x="18" y="112" font-family="'DM Mono', monospace" font-size="11" fill="#0E0F11">Anomaly Index: 0.14 (Safe Routine)</text>

      <!-- Spatial Model Metrics -->
      <line x1="18" y1="130" x2="362" y2="130" stroke="#F0F0ED" stroke-width="1"/>
      <text x="18" y="156" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">AVG VELOCITY: 41.8 km/h</text>
      <text x="18" y="178" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">CLUSTER ID: #CL-04 (Commuter Core)</text>
      <text x="18" y="200" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">TRAFFIC FORECAST: MODERATE FLOW</text>
      <text x="18" y="222" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PREDICTED ARRIVAL: 14:18 (CAM-04)</text>

      <!-- System Pill -->
      <rect x="18" y="246" width="344" height="42" rx="6" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
      <text x="32" y="272" font-family="'DM Mono', monospace" font-size="10" fill="#0E0F11">FastAPI Backend Pipeline · Real-time Graph</text>
    </g>
  </g>
</svg>

