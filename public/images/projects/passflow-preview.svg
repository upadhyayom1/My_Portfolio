<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="1200" height="750" rx="12" fill="#FBFBF9" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Subtle Grid Texture -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#F0F0ED" stroke-width="1"/>
    </pattern>
    <linearGradient id="depthAsk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="depthBid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17804A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#17804A" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" rx="12" fill="url(#grid)"/>

  <!-- Top Navigation / Application Bar -->
  <rect x="0" y="0" width="1200" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="0" y="44" width="1200" height="20" fill="#FFFFFF"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="36" cy="32" r="6" fill="#D7D9DE"/>
  <circle cx="56" cy="32" r="6" fill="#E5E7EB"/>
  <circle cx="76" cy="32" r="6" fill="#E5E7EB"/>

  <!-- Brand Title -->
  <text x="110" y="38" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="16" fill="#0E0F11" letter-spacing="-0.02em">PassFlow</text>
  <rect x="190" y="22" width="70" height="20" rx="4" fill="#F0F0ED"/>
  <text x="200" y="36" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72" letter-spacing="0.04em">EXCHANGE</text>

  <!-- Market Selector -->
  <rect x="290" y="18" width="220" height="28" rx="6" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="306" y="36" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="13" fill="#0E0F11">Coldplay — Music of Spheres</text>
  <text x="475" y="35" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72">▾</text>

  <!-- Live Status & Socket.IO Indicator -->
  <circle cx="1040" cy="32" r="4" fill="#17804A"/>
  <text x="1052" y="36" font-family="'DM Mono', monospace" font-size="11" fill="#17804A" letter-spacing="0.04em">SOCKET CONNECTED</text>
  <rect x="880" y="20" width="130" height="24" rx="4" fill="#F0F0ED"/>
  <text x="892" y="36" font-family="'DM Mono', monospace" font-size="11" fill="#0E0F11">LEDGER: AUDITED</text>

  <!-- Left Column: In-Memory Order Book (Width: 420px) -->
  <rect x="36" y="90" width="440" height="624" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="36" y="90" width="440" height="48" rx="8" fill="#FAFAF8"/>
  <rect x="36" y="128" width="440" height="10" fill="#FAFAF8"/>
  <line x1="36" y1="138" x2="476" y2="138" stroke="#E5E7EB" stroke-width="1"/>
  <text x="56" y="120" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" fill="#0E0F11">Order Book (FIFO Matching)</text>
  <rect x="360" y="104" width="96" height="20" rx="4" fill="#F0F0ED"/>
  <text x="372" y="118" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72">EVENT #0492</text>

  <!-- Table Header -->
  <text x="56" y="166" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PRICE (INR)</text>
  <text x="200" y="166" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">QTY (TIER-A)</text>
  <text x="360" y="166" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72" text-anchor="end">TOTAL (INR)</text>
  <line x1="56" y1="178" x2="456" y2="178" stroke="#F0F0ED" stroke-width="1"/>

  <!-- Asks (Sells) -->
  <!-- Ask row 1 -->
  <rect x="56" y="186" width="400" height="26" fill="url(#depthAsk)"/>
  <text x="56" y="204" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#EF4444">₹ 4,850.00</text>
  <text x="210" y="204" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">4</text>
  <text x="456" y="204" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 19,400</text>

  <!-- Ask row 2 -->
  <rect x="56" y="216" width="340" height="26" fill="url(#depthAsk)"/>
  <text x="56" y="234" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#EF4444">₹ 4,800.00</text>
  <text x="210" y="234" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">8</text>
  <text x="456" y="234" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 38,400</text>

  <!-- Ask row 3 -->
  <rect x="56" y="246" width="220" height="26" fill="url(#depthAsk)"/>
  <text x="56" y="264" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#EF4444">₹ 4,750.00</text>
  <text x="210" y="264" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">2</text>
  <text x="456" y="264" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 9,500</text>

  <!-- Spread Indicator Bar -->
  <rect x="56" y="286" width="400" height="38" rx="6" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="74" y="310" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="15" fill="#0E0F11">Spread: ₹ 50.00</text>
  <text x="340" y="310" font-family="'DM Mono', monospace" font-size="11" fill="#17804A">MARKET ACTIVE</text>

  <!-- Bids (Buys) -->
  <!-- Bid row 1 -->
  <rect x="56" y="338" width="380" height="26" fill="url(#depthBid)"/>
  <text x="56" y="356" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#17804A">₹ 4,700.00</text>
  <text x="210" y="356" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">6</text>
  <text x="456" y="356" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 28,200</text>

  <!-- Bid row 2 -->
  <rect x="56" y="368" width="280" height="26" fill="url(#depthBid)"/>
  <text x="56" y="386" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#17804A">₹ 4,650.00</text>
  <text x="210" y="386" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">10</text>
  <text x="456" y="386" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 46,500</text>

  <!-- Bid row 3 -->
  <rect x="56" y="398" width="160" height="26" fill="url(#depthBid)"/>
  <text x="56" y="416" font-family="'DM Mono', monospace" font-size="13" font-weight="500" fill="#17804A">₹ 4,600.00</text>
  <text x="210" y="416" font-family="'DM Mono', monospace" font-size="13" fill="#6B6D72">3</text>
  <text x="456" y="416" font-family="'DM Mono', monospace" font-size="13" fill="#0E0F11" text-anchor="end">₹ 13,800</text>

  <!-- Matching Engine Status Box -->
  <rect x="56" y="446" width="400" height="248" rx="6" fill="#FBFBF9" stroke="#E5E7EB" stroke-width="1"/>
  <text x="74" y="476" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13" fill="#0E0F11">Engine Diagnostics</text>
  <text x="74" y="506" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">MATCH_STRATEGY: PRICE_TIME_FIFO</text>
  <text x="74" y="530" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PARTIAL_FILL: ENABLED (REST_POSTED)</text>
  <text x="74" y="554" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">ISOLATION: PER_EVENT_KEYSPACE</text>
  <text x="74" y="578" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">LOCKING: ROW_LEVEL_TRANSACTIONAL</text>
  <rect x="74" y="604" width="364" height="66" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="90" y="628" font-family="'DM Mono', monospace" font-size="11" fill="#17804A">✓ TX #8928: 2 Tickets Transferred</text>
  <text x="90" y="650" font-family="'DM Mono', monospace" font-size="10" fill="#6B6D72">Settled: ₹9,400.00 · Ledger Balance Updated</text>

  <!-- Right Column Top: Real-Time Market Visual & Ticker (Width: 650px) -->
  <rect x="500" y="90" width="664" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="500" y="90" width="664" height="48" rx="8" fill="#FAFAF8"/>
  <rect x="500" y="128" width="664" height="10" fill="#FAFAF8"/>
  <line x1="500" y1="138" x2="1164" y2="138" stroke="#E5E7EB" stroke-width="1"/>
  <text x="524" y="120" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" fill="#0E0F11">Market Activity &amp; Depth Stream</text>
  <text x="1030" y="120" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">1 SEC INTERVAL</text>

  <!-- Market Depth Chart Visualization -->
  <path d="M 530 380 L 590 350 L 650 340 L 710 320 L 770 290 L 810 240 L 850 240 L 890 270 L 950 310 L 1020 330 L 1090 360 L 1134 380" fill="none" stroke="#0E0F11" stroke-width="2.5"/>
  <path d="M 530 380 L 590 350 L 650 340 L 710 320 L 770 290 L 810 240 L 810 380 Z" fill="#17804A" fill-opacity="0.08"/>
  <path d="M 850 240 L 890 270 L 950 310 L 1020 330 L 1090 360 L 1134 380 L 850 380 Z" fill="#EF4444" fill-opacity="0.06"/>
  <line x1="830" y1="170" x2="830" y2="380" stroke="#6B6D72" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="784" y="160" width="92" height="24" rx="4" fill="#0E0F11"/>
  <text x="830" y="176" font-family="'DM Mono', monospace" font-size="11" fill="#FAFAF8" text-anchor="middle">₹ 4,725.00</text>

  <!-- Right Column Bottom: Ticket Vault & Ownership State (Width: 664px) -->
  <rect x="500" y="450" width="664" height="264" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="500" y="450" width="664" height="48" rx="8" fill="#FAFAF8"/>
  <rect x="500" y="488" width="664" height="10" fill="#FAFAF8"/>
  <line x1="500" y1="498" x2="1164" y2="498" stroke="#E5E7EB" stroke-width="1"/>
  <text x="524" y="480" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" fill="#0E0F11">Atomic Ticket Ownership Ledger</text>
  <rect x="1050" y="464" width="90" height="20" rx="4" fill="#17804A" fill-opacity="0.1"/>
  <text x="1062" y="478" font-family="'DM Mono', monospace" font-size="10" fill="#17804A">VERIFIED</text>

  <!-- Two Ticket Cards -->
  <g transform="translate(524, 520)">
    <rect width="300" height="170" rx="8" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="32" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" fill="#0E0F11">VIP Standing · Gate 4</text>
    <text x="20" y="52" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PASS-ID: #0492-8921</text>
    <line x1="20" y1="68" x2="280" y2="68" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="94" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">OWNER: 0x8F4b...38A</text>
    <text x="20" y="116" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PRICE CAP: ₹5,000</text>
    <rect x="20" y="132" width="100" height="22" rx="4" fill="#17804A"/>
    <text x="70" y="147" font-family="'DM Mono', monospace" font-size="10" fill="#FAFAF8" text-anchor="middle">SETTLED</text>
  </g>

  <g transform="translate(844, 520)">
    <rect width="300" height="170" rx="8" fill="#F7F7F5" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="32" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" fill="#0E0F11">General Lounge · Gate 2</text>
    <text x="20" y="52" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">PASS-ID: #0492-8922</text>
    <line x1="20" y1="68" x2="280" y2="68" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="94" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">STATUS: IN_ORDER_BOOK</text>
    <text x="20" y="116" font-family="'DM Mono', monospace" font-size="11" fill="#6B6D72">ESCROW: RESERVED</text>
    <rect x="20" y="132" width="100" height="22" rx="4" fill="#0E0F11"/>
    <text x="70" y="147" font-family="'DM Mono', monospace" font-size="10" fill="#FAFAF8" text-anchor="middle">ACTIVE ASK</text>
  </g>
</svg>

